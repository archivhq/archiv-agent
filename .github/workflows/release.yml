# Release pipeline for archiv-agent (Open_Source Edition).
#
# Trigger: pushing a version tag (v1.0.0, v1.0.1, etc.).
# Gate order:
#   lint -> tests -> dep scans -> build -> SBOM -> scan -> sign -> attest -> push.
#
# The image is pushed by digest, then cosign keyless-signed +
# SBOM/SLSA-attested.
#
# The community binary tarball is checksummed and cosign sign-blob'd
# onto the GitHub Release.
#
# Signing identity:
# cosign verify ghcr.io/archivhq/archiv-agent@<digest> \
#   --certificate-identity-regexp \
#   '^https://github.com/archivhq/archiv-agent/\.github/workflows/release\.yml@refs/tags/v.*$' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# No long-lived secrets: OIDC only.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.0
        with:
          toolchain: stable

      - run: rustup show

      - uses: Swatinem/rust-cache@v2.7.8

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy + Memory-Law gate
        run: bash scripts/lint-no-clone.sh

      - name: Test
        run: cargo test --all --locked

      - name: Install supply-chain scanners
        run: |
          cargo install cargo-audit --version 0.22.0 --locked
          cargo install cargo-deny --version 0.18.3 --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

  image:
    name: Build container image
    needs: checks

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.0
        with:
          toolchain: stable

      - name: Reproducible timestamp
        id: sde
        run: |
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3.3.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Login GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64

          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.epoch }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Login GHCR for Syft
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Generate SBOM
        run: |
          syft "registry:${IMAGE}@${{ steps.build.outputs.digest }}" \
            -o spdx-json=sbom.spdx.json

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Sign image
        run: |
          cosign sign --yes \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

  binaries:
    name: Release binary
    needs: checks

    runs-on: ubuntu-24.04

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.0
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.7.8

      - name: Build release binary
        run: |
          cargo build --release --locked --bin archiv-agent

      - name: Package tarball
        id: pkg
        run: |
          ver="${GITHUB_REF_NAME#v}"

          name="archiv-agent-${ver}-x86_64-unknown-linux-gnu"

          mkdir -p "dist/${name}"

          install -Dm755 \
            target/release/archiv-agent \
            "dist/${name}/archiv-agent"

          cp LICENSE README.md "dist/${name}/"

          tar -C dist \
            -czf "${name}.tar.gz" \
            "${name}"

          sha256sum "${name}.tar.gz" \
            > "${name}.tar.gz.sha256"

          echo "tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign binary tarball
        run: |
          cosign sign-blob --yes \
            --output-signature "${{ steps.pkg.outputs.tarball }}.sig" \
            --output-certificate "${{ steps.pkg.outputs.tarball }}.pem" \
            "${{ steps.pkg.outputs.tarball }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.tarball }}.sha256
            ${{ steps.pkg.outputs.tarball }}.sig
            ${{ steps.pkg.outputs.tarball }}.pem
          generate_release_notes: true

# Continuous integration for archiv-agent (Open_source Edition).
# lint -> test -> dependency scan.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4.2.2

      # Install the Rust toolchain specified in rust-toolchain.toml
      - run: rustup show

      - uses: Swatinem/rust-cache@v2.7.8

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy + Memory-Law gate
        run: bash scripts/lint-no-clone.sh

      - name: Test
        run: cargo test --all --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Show tool versions
        run: |
          cargo audit --version
          cargo deny --version

      - name: cargo audit (RustSec advisories)
        run: cargo audit

      - name: cargo deny (licenses, bans, sources, advisories)
        run: cargo deny check

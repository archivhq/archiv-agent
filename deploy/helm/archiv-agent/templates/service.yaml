{{- if .Values.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "archiv-agent.fullname" . }}
  labels:
    {{- include "archiv-agent.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  # "Local" keeps OTLP on the sender's own node (each DaemonSet pod serves its node); "Cluster"
  # load-balances across all agents.
  internalTrafficPolicy: {{ .Values.service.internalTrafficPolicy }}
  selector:
    {{- include "archiv-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
{{- end }}

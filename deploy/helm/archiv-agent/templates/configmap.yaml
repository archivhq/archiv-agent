apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "archiv-agent.fullname" . }}
  labels:
    {{- include "archiv-agent.labels" . | nindent 4 }}
data:
  # Mounted read-only at /etc/archiv/agent.yaml; ARCHIV_CONFIG points the agent here.
  # Schema: config/agent.example.yaml. Empty config ⇒ pass-through agent.
  agent.yaml: |
    {{- toYaml .Values.config | nindent 4 }}

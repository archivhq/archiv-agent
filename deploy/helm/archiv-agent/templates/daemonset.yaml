apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "archiv-agent.fullname" . }}
  labels:
    {{- include "archiv-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "archiv-agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "archiv-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll pods when the rendered config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "archiv-agent.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: archiv-agent
          image: {{ include "archiv-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ARCHIV_CONFIG
              value: /etc/archiv/agent.yaml
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
              {{- if .Values.hostPort.enabled }}
              hostPort: 4317
              {{- end }}
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
              {{- if .Values.hostPort.enabled }}
              hostPort: 4318
              {{- end }}
          # No HTTP health route (aggregates go to stdout, not an endpoint) — probe the ingest
          # sockets instead: a bound listener is a live, ready agent.
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/archiv
              readOnly: true
            - name: spool
              mountPath: {{ .Values.config.export.spool_dir | default "/var/lib/archiv/spool" }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "archiv-agent.fullname" . }}
        - name: spool
          {{- if eq .Values.spool.type "hostPath" }}
          hostPath:
            path: {{ .Values.spool.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.spool.sizeLimit }}
          {{- end }}
        # readOnlyRootFilesystem is on — give libc/tokio a writable scratch dir.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "archiv-agent.serviceAccountName" . }}
  labels:
    {{- include "archiv-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent needs no Kubernetes API access — it only proxies OTLP. Never auto-mount a token.
automountServiceAccountToken: false
{{- end }}
